<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title><style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.chat-container {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.header {
    background: #4f46e5;
    color: white;
    text-align: center;
    padding: 22px;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 5px;
}

#chat-box {
    height: 430px;
    padding: 20px;
    overflow-y: auto;
    background: #f5f5f5;
}

.message {
    max-width: 80%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user-message {
    background: #4f46e5;
    color: white;
    margin-left: auto;
    border-radius: 12px 12px 0 12px;
}

.bot-message {
    background: white;
    color: #222;
    margin-right: auto;
    border-radius: 12px 12px 12px 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.input-area {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #ddd;
}

#user-input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

#send-button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
}

#send-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

@media(max-width:600px) {
    #chat-box {
        height: 400px;
    }
}

</style></head><body><div class="chat-container"><div class="header">
    <h1>🤖 AI Chatbot</h1>
    <p>Powered by Gemini AI</p>
</div>

<div id="chat-box" aria-live="polite">
    <div class="message bot-message">
        🤖 Hello! I'm your AI assistant. How can I help you?
    </div>
</div>

<div class="input-area">

    <input
        type="text"
        id="user-input"
        placeholder="Ask me anything..."
        autocomplete="off"
    >

    <button id="send-button">Send</button>

</div>

</div><script>

// ==================================
// GEMINI API CONFIGURATION
// ==================================

// Paste your Gemini API key below.
// WARNING: This exposes the key in browser code.
// Use only for private local testing.

const API_KEY = "AQ.Ab8RN6JV_l1WxxkDyG6FaXTGul3lTjWdDWjU4Z-J-NXNPB4uKw";

// Gemini model
const MODEL = "gemini-2.5-flash";

const API_URL =
`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

// ==================================
// CHATBOT SYSTEM
// ==================================

const chatBox = document.getElementById("chat-box");

const userInput = document.getElementById("user-input");

const sendButton = document.getElementById("send-button");

let conversationHistory = [];

// ==================================
// DISPLAY MESSAGE
// ==================================

function addMessage(message, className) {

    const messageElement = document.createElement("div");

    messageElement.className = "message " + className;

    messageElement.textContent = message;

    chatBox.appendChild(messageElement);

    chatBox.scrollTop = chatBox.scrollHeight;

    return messageElement;
}

// ==================================
// SEND MESSAGE TO GEMINI
// ==================================

async function sendMessage() {

    const message = userInput.value.trim();

    if (!message || sendButton.disabled) {
        return;
    }

    if (API_KEY === "YOUR_GEMINI_API_KEY") {
        addMessage(
            "Please add your Gemini API key in the code first.",
            "bot-message"
        );
        return;
    }

    addMessage(message, "user-message");

    userInput.value = "";

    sendButton.disabled = true;

    sendButton.textContent = "Thinking...";

    const loadingMessage = addMessage(
        "🤖 Thinking...",
        "bot-message"
    );

    try {

        const contents = [
            ...conversationHistory,
            {
                role: "user",
                parts: [{ text: message }]
            }
        ];

        const response = await fetch(
            API_URL + "?key=" + encodeURIComponent(API_KEY),
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    contents: contents,

                    systemInstruction: {
                        parts: [{
                            text: "You are a helpful, friendly and intelligent AI assistant. Answer questions clearly and accurately."
                        }]
                    }

                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "Gemini API request failed."
            );
        }

        const reply =
            data.candidates?.[0]?.content?.parts
                ?.map(part => part.text || "")
                .join("")
                .trim();

        if (!reply) {
            throw new Error("No response received from Gemini.");
        }

        loadingMessage.remove();

        addMessage(reply, "bot-message");

        conversationHistory.push(
            {
                role: "user",
                parts: [{ text: message }]
            },
            {
                role: "model",
                parts: [{ text: reply }]
            }
        );

        // Keep the most recent conversation messages
        conversationHistory = conversationHistory.slice(-20);

    }

    catch(error) {

        loadingMessage.remove();

        addMessage(
            "❌ Error: " + error.message,
            "bot-message"
        );

        console.error(error);

    }

    finally {

        sendButton.disabled = false;

        sendButton.textContent = "Send";

        userInput.focus();

    }

}

// ==================================
// BUTTON EVENT
// ==================================

sendButton.addEventListener("click", sendMessage);

// ==================================
// ENTER KEY EVENT
// ==================================

userInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script></body>
</html>
