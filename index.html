<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .chat-container {
            width: 100%;
            max-width: 600px;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .header {
            background: #4f46e5;
            color: white;

            text-align: center;

            padding: 22px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
        }

        #chat-box {
            height: 430px;

            padding: 20px;

            overflow-y: auto;

            background: #f5f5f5;
        }

        .message {
            max-width: 80%;

            padding: 12px 15px;

            margin-bottom: 15px;

            border-radius: 12px;

            line-height: 1.5;

            word-wrap: break-word;
        }

        .user-message {
            background: #4f46e5;
            color: white;

            margin-left: auto;

            border-radius: 12px 12px 0 12px;
        }

        .bot-message {
            background: white;
            color: #222;

            margin-right: auto;

            border-radius: 12px 12px 12px 0;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .input-area {
            display: flex;

            gap: 10px;

            padding: 15px;

            border-top: 1px solid #ddd;

            background: white;
        }

        #user-input {
            flex: 1;

            padding: 13px 15px;

            border: 1px solid #ccc;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        #user-input:focus {
            border-color: #4f46e5;
        }

        #send-button {
            padding: 12px 20px;

            border: none;

            border-radius: 10px;

            background: #4f46e5;

            color: white;

            cursor: pointer;

            font-size: 15px;
        }

        #send-button:hover {
            background: #3730a3;
        }

        @media (max-width: 600px) {

            .chat-container {
                width: 100%;
            }

            #chat-box {
                height: 400px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>


<body>

    <div class="chat-container">

        <div class="header">

            <h1>🤖 AI Chatbot</h1>

            <p>Powered by Gemini AI</p>

        </div>


        <div id="chat-box">

            <div class="message bot-message">
                🤖 Hello! I'm your AI assistant. How can I help you?
            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Ask me anything..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
